name: Pixel world compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node check-motion.cjs
      - run: node tests/check-world.cjs
      - run: node check-appearance.cjs
      - run: node tests/check-atelier.cjs
      - run: node tests/check-figure-study.cjs
  image-conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: |
          python3 -m venv "$RUNNER_TEMP/turnaround-python"
          "$RUNNER_TEMP/turnaround-python/bin/pip" install numpy Pillow
          "$RUNNER_TEMP/turnaround-python/bin/python" tests/test_turnaround.py
      - run: node tests/check-turnaround-lab.cjs
