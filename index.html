<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#244638" />
    <title>世界编辑器 · 松溪像素世界</title>
    <link rel="stylesheet" href="world.css" />
    <link rel="stylesheet" href="workspace.css">
    <script defer src="workspace.js"></script>
    <script defer src="motion.js"></script>
    <script defer src="character-slices.js"></script>
    <script defer src="scene-depth.js"></script>
    <script defer src="actor.js"></script>
    <script defer src="surveyor-art.js"></script>
    <script defer src="family-art.js"></script>
    <script defer src="vehicle-slices.js"></script>
    <script defer src="world-objects.js"></script>
    <script defer src="activity-props.js"></script>
    <script defer src="studio-props.js"></script>
    <script defer src="studio-rig.js"></script>
    <script defer src="studio-actions.js"></script>
    <script defer src="duet-clips.js"></script>
    <script defer src="motion-gestures.js"></script>
    <script defer src="movement-clips.js"></script>
    <script defer src="daily-clips.js"></script>
    <script defer src="social-clips.js"></script>
    <script defer src="work-clips.js"></script>
    <script defer src="studio-library.js"></script>
    <script defer src="pixel-headwear.js"></script>
    <script defer src="pixel-portrait.js"></script>
    <script defer src="portrait-styles.js"></script>
    <script defer src="hair-styles.js"></script>
    <script defer src="head-sections.js"></script>
    <script defer src="skull-core.js"></script>
    <script defer src="head-shape.js"></script>
    <script defer src="game-face.js"></script>
    <script defer src="short-hair.js"></script>
    <script defer src="collection-wardrobe.js"></script>
    <script defer src="everyday-styles.js"></script>
    <script defer src="workshop-wear.js"></script>
    <script defer src="world-wardrobe.js"></script>
    <script defer src="character-collection.js"></script>
    <script defer src="figure-paint.js"></script>
    <script defer src="anatomy-core.js"></script>
    <script defer src="designer-body.js"></script>
    <script defer src="appearance.js"></script>
    <script defer src="appearance-store.js"></script>
    <script defer src="world-editor.js"></script>
  </head>
  <body data-workspace="world">
    <header data-app-nav="world"></header>
    <main class="atlas workspace-main">
      <header class="page-heading">
        <div class="page-name">
          <h1>世界编辑器</h1>
          <span id="inventory-count"></span>
        </div>
        <div class="page-actions">
          <div class="history-tools" role="group" aria-label="编辑历史">
            <button id="edit-undo" type="button" disabled title="撤销上一步">撤销</button>
            <button id="edit-redo" type="button" disabled title="重做上一步">重做</button>
          </div>
          <details class="workspace-files">
            <summary>文件</summary>
            <div>
              <button id="world-export" type="button">导出场景 JSON</button>
              <button id="open-world-file" type="button">导入场景 JSON</button>
            </div>
          </details>
          <a id="world-studio" class="work-primary" href="studio.html?board=1">编排场景动作 <span aria-hidden="true">→</span></a>
        </div>
      </header>
      <p id="world-status" class="workspace-notice" role="status" aria-live="polite"></p>
      <input type="file" id="world-import" accept=".json,application/json" hidden>
      <div class="layout workspace-desk" data-desk>
        <section class="scene-panel desk-preview" id="scene-preview" data-label="预览" aria-label="场景编辑器">
          <header class="scene-bar">
            <label
              >场景
              <select id="world-scene"></select
            ></label>
            <label>精细度
              <select id="world-detail"><option value="figure">精细</option><option value="standard">标准</option></select>
            </label>
            <label id="view-space-field" hidden>视图<select id="world-space" aria-label="建筑视图"></select></label>
            <div>
              <button id="world-play" type="button" aria-pressed="false">播放动作</button
              ><button type="button" id="world-reset-view">视角复位</button>
            </div>
          </header>
          <div class="world-viewport">
            <canvas
              id="world-canvas"
              tabindex="0"
              aria-label="像素场景，点选演员或物件，拖动环视。方向键旋转或缩放，空格播放"
            ></canvas>
            <span class="pick-hint" id="picked-name">点选物件 · 拖动环视</span>
            <div class="scene-caption">
              <span id="scene-realm"></span>
              <h2 id="scene-title"></h2>
            </div>
            <div class="camera-strip">
              <label
                >方位 <input type="range" id="world-angle" min="-180" max="180" step="1" value="35" /></label
              ><output id="angle-label">35°</output
              ><button type="button" id="zoom-out" aria-label="缩小">−</button
              ><button type="button" id="zoom-in" aria-label="放大">＋</button>
            </div>
          </div>
          <div id="route-playback" class="route-playback" hidden>
            <label>动作进度 <input id="world-scrub" type="range" min="0" max="1" step="0.001" value="0" /></label>
            <output id="route-time" for="world-scrub"></output><button id="upper-landing" type="button">停在楼上</button>
          </div>
        </section>
        <div class="tool-side"><div class="tool-tabs" role="tablist" aria-label="编辑工具"></div>
        <section class="collection tool-pane" data-tool id="object-library" data-label="物件库">
          <header>
            <h2>选择物件</h2>
            <output id="catalog-count"></output>
          </header>
          <input type="search" id="world-query" placeholder="搜索飞机、台灯、花草…" aria-label="搜索物件" />
          <div class="catalog-filters">
            <label
              >分类<select id="world-family">
                <option value="">全部分类</option>
              </select></label
            ><label
              >时代<select id="world-realm">
                <option value="">全部时代</option>
              </select></label
            >
          </div>
          <button class="clear-filter" id="clear-objects" type="button" hidden>清除筛选</button>
          <div id="world-grid" class="object-grid" aria-label="物件列表"></div>
          <div class="item-inspect">
            <canvas id="item-preview" width="112" height="96" aria-hidden="true"></canvas>
            <div>
              <h3 id="item-name"></h3>
              <p id="item-spec"></p>
            </div>
            <button id="place-item">放入场景</button>
          </div>
        </section>
          <section id="placements" class="tool-pane" data-tool data-label="场景层级" data-count="tree-count" hidden>
            <h2><span id="placement-title">场景中的物件</span> <span id="placement-count"></span></h2>
            <div class="placement-body">
              <ul id="scene-tree" class="scene-tree" aria-label="场景层级" hidden></ul>
              <div class="placement-inspector">
                <label id="flat-picker" class="pick-place">选择物件<select id="placed"></select></label>
                <strong id="selection-name" hidden></strong>
                <button type="button" id="gather-interior" hidden>将范围内的人物和物件移入</button>
                <label id="parent-field" hidden>所属空间<select id="place-parent"></select></label>
                <div class="coords">
                <label>X<input id="place-x" type="number" min="-256" max="256" step="any" /></label
                ><label>Y<input id="place-y" type="number" min="-256" max="256" step="any" /></label
                ><label>高度<input id="place-z" type="number" min="0" max="256" step="any" /></label
                ><label
                  >朝向 °<input id="place-heading" type="number" min="-360" max="360" step="any" /></label
                ><button type="button" id="remove-place">移除</button>
                </div>
                <small id="coordinate-note" hidden></small>
              </div>
            </div>
            <button type="button" id="more-items" class="back-to-tools">继续添加物件</button>
          </section>
          <section class="tool-pane" data-tool id="scene-cast" data-label="演员与动作" hidden>
            <h2>首段演员与动作</h2>
          <div class="cast-row">
            <label>演员<select id="world-actor"></select></label
            ><label>动作<select id="world-clip"></select></label>
            <button id="select-cast" type="button">演员位置</button>
            <a id="edit-scene-actor" class="back-to-tools" href="atelier.html">打开人物外观</a>
          </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
