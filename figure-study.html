  </head>
  <body data-workspace="atelier">
    <header data-app-nav="atelier"></header>
    <main class="study">
      <header class="heading">
        <h1>人物造型对照</h1>
        <nav aria-label="评审方式"><a href="anatomy-study.html">人体建模台</a><button data-mode="model" aria-pressed="true">同一配方</button><button data-mode="blind" aria-pressed="false">随机盲评</button></nav>
      </header>
      <section class="toolbar" aria-label="人物与镜头">
        <label id="model-field">人物<select id="subject">
          <optgroup label="标准配方"><option value="adult">成人 · 衬衫</option><option value="child">儿童 · 套头衫</option><option value="toddler">幼儿 · 背带裤</option><option value="baby">婴儿 · 棉套装</option>
          <option value="hoodie">深色连帽衫</option><option value="chef">浅色厨师服</option></optgroup>
          <optgroup label="本轮随机"><option value="adult-female">成人 · 女性日常装</option><option value="child-6">儿童 06 · 短袖运动装</option><option value="toddler-1">幼儿 01 · 日常装</option><option value="baby-face-1">婴儿 01 · 坐姿侧脸</option><option value="baby02-profile">婴儿 02 · 鼻唇试调</option><option value="baby02-pad">婴儿 02 · 饱满下巴</option></optgroup>
          <optgroup id="baseline-subjects" label="上一轮连续随机"></optgroup>
          <optgroup label="创作室普通随机"><option value="blue-jacket">黑发蓝衣 · 宽鼻丰满唇</option><option value="yellow-hardhat">黄帽浅发 · 短鼻厚下唇</option></optgroup>
        </select></label>
        <label id="before-field">比较内容<select id="before">
          <option value="everyday">普通随机 · 柔和像素脸</option>
          <option value="storybook">柔和像素脸与绘本像素</option>
          <option value="storybook-lips">绘本像素 · 鼻唇对照</option>
          <option value="fitted-story">绘本人物 · 普通与分龄全身</option>
          <optgroup id="whole-comparisons" label="完整人物"><option value="whole-1.19.12">稳定版与完整试作 · 1.18.0 / 1.19.12</option><option value="whole-1.19.9">稳定版与完整试作 · 1.18.0 / 1.19.9</option><option value="whole-1.19.8">稳定版与完整试作 · 1.18.0 / 1.19.8</option><option value="whole-1.19.7">稳定版与完整试作 · 1.18.0 / 1.19.7</option><option value="whole-1.19.6">稳定版与完整试作 · 1.18.0 / 1.19.6</option><option value="whole">稳定版与全身试作 · 1.18.0 / 1.19.3</option></optgroup>
          <optgroup label="分项试作"><option value="profile-line">侧脸 · 嘴角与唇颏轮廓</option><option value="surface">眼眶与口周 · 随五官塑形</option><option value="mouth-size">游戏尺寸 · 唇中央笔触</option><option value="ink">同脸对照 · 像素笔触</option><option value="baby-nose">婴儿鼻部 · 浅鼻根与圆鼻头</option><option value="bases">分龄基础脸 · 1.19.3 / 1.19.4</option><option value="cut">分龄衣物剪裁 · 1.19.4 / 1.19.5</option><option value="features">五官与下颌 · 1.19.5 / 1.19.6</option><option value="ratios">头身与侧脸比例 · 1.19.6 / 1.19.7</option><option value="acting">眼神与坐姿 · 1.19.7 / 1.19.8</option><option value="garments">上衣与裤腿版型 · 1.19.8 / 1.19.9</option><option value="chin">婴儿下巴 · 短圆试作</option><option value="chin-pad">下唇到颏尖 · 婴儿唇下轮廓</option></optgroup>
          <optgroup label="单项对照"><option value="1.19.2" selected>1.19.2 · 人体结构</option><option value="1.19.1">1.19.1 · 身体比例</option><option value="1.19.0">1.19.0 · 首版试作</option><option value="1.18.0">1.18.0 · 稳定版</option><option value="finish">1.19.3 · 原有身体着色</option></optgroup>
        </select></label>
        <label id="form-field" hidden>比较的脸型<select id="drawn-form"><option value="">随人物配方</option><option value="balanced">均衡</option><option value="long">长脸</option><option value="round">短圆脸</option><option value="angular">方脸</option></select></label>
        <label id="review-field" hidden>比较内容<select id="review-kind"><option value="everyday">同一普通随机人物 · 面部画法</option><option value="storybook">同一普通随机人物 · 绘本像素</option><option value="storybook-lips">同一随机人物 · 绘本鼻唇</option><option value="face">同配方 · 基础脸</option><option value="ensemble">同配方 · 全身与立绘五官</option><option value="ink">同配方 · 立绘五官</option><option value="cast">独立生成 · 整体人物</option><option value="bases">同配方 · 分龄基础脸</option><option value="cut">同配方 · 分龄衣物剪裁</option><option value="features">同配方 · 五官与下颌</option><option value="ratios">同配方 · 头身与侧脸比例</option><option value="acting">同配方 · 眼神与坐姿</option><option value="garments">同配方 · 分款剪裁</option></select></label>
        <label id="age-field" hidden>年龄<select id="age"><option value="adult">成人</option><option value="child">儿童</option><option value="toddler">幼儿</option><option value="baby">婴儿</option></select></label>
        <label>动作<select id="action"></select></label>
        <label>镜头<select id="framing"><option value="body">全身</option><option value="head">头肩 · 原像素放大</option></select></label>
        <label title="数字按本组较高的人物定标。厘米尺让不同年龄共用机位和地面">像素尺度<select id="sample-size"><option value="256">256 像素</option><option value="128">128 像素</option><option value="64">64 像素</option><option value="world">统一厘米尺 · 1 像素/cm</option></select></label>
        <label>画法<select id="ink"><option value="color">原色</option><option value="values">三档明暗</option><option value="silhouette">黑色剪影</option></select></label>
        <div class="angles" aria-label="预设视角">
          <button data-angle="0" aria-pressed="true">正面</button><button data-angle="315" aria-pressed="false">斜面</button><button data-angle="270" aria-pressed="false">侧面</button><button data-angle="180" aria-pressed="false">背面</button>
        </div>
      </section>
      <p id="source-status" role="status" hidden></p>
      <p id="prompt">同一人物配方、镜头与动作帧，分别用两版实时切片绘制。</p>
      <p id="pose-note" hidden>双人动作按搭档的位置取姿势，两侧都显示正在对照的人物。<a id="rattle-film" href="studies/pixel-structure/rattle-gaze.webp" hidden>看标准搭档的追视动图</a></p>
      <div class="pair" id="pair">
        <figure><figcaption><span id="title-a">1.19.2 · 人体结构</span><a id="edit-a" hidden>到创作室编辑</a></figcaption><canvas id="canvas-a" aria-labelledby="title-a"></canvas></figure>
        <figure><figcaption><span id="title-b">1.19.3 · 美术基础脸</span><a id="edit-b" hidden>到创作室编辑</a></figcaption><canvas id="canvas-b" aria-labelledby="title-b"></canvas></figure>
      </div>
      <section class="transport" aria-label="回放">
        <label>视角 <output id="angle-value" for="bearing">0°</output><input id="bearing" type="range" min="0" max="360" step="any" value="0"></label>
        <label>动作进度 <output id="phase-value" for="phase">17%</output><input id="phase" type="range" min="0" max="100" step="any" value="17"></label>
        <button id="play" aria-pressed="false">播放动作</button>
        <button type="button" id="face-marks" hidden aria-pressed="false" aria-describedby="face-key">五官定位点</button>
        <a id="face-gallery" href="studies/pixel-structure/game-faces.webp">新旧脸型实拍</a>
      </section>
      <p id="face-key" hidden>青色为双眼中心，金色为鼻尖与鼻底，玫红为唇缝中央与两侧嘴角，蓝色为颏尖。标记可透过头发和远侧脸面看到。</p>
      <section id="review" hidden aria-label="盲评">
        <div class="review-head"><h2 id="round">人物对照</h2><span id="progress"></span></div>
        <p>选出整体造型更协调的一侧。每组的左右顺序已打乱，完成 32 组后揭晓。</p>
        <div class="votes" aria-label="偏好"><button data-vote="a">偏好 A</button><button data-vote="tie">两者相当</button><button data-vote="b">偏好 B</button></div>
        <div class="review-nav"><button id="prev">上一组</button><span id="saved" role="status"></span><button id="next">下一组</button></div>
        <div id="results" hidden><div class="review-head"><h2>分龄结果</h2><button id="export">下载评审记录</button></div><table><thead><tr><th>年龄</th><th>偏好原版</th><th>相当</th><th>偏好试作</th></tr></thead><tbody id="counts"></tbody></table></div>
      </section>
      <section class="guide" id="guide">
        <div class="review-head"><h2 id="guide-label">造型设定稿</h2><div class="guide-links"><a href="figure-model-guide.webp">完整设定稿</a><a href="figure-study-1.19.1-turnaround.webp">1.19.1 四向对照</a><a href="figure-study-turnaround.webp">首版四向图</a></div></div>
        <div class="guide-strip"><img id="guide-img" src="figure-model-guide.webp" alt="同一人物的正面、斜面、侧面和背面像素设定"></div>
      </section>
      <noscript>启用 JavaScript 后可查看实时切片并参加盲评。</noscript>
    </main>
  </body>
</html>
