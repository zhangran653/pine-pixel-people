<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b302a" />
    <title>人物创作室 · 松溪像素世界</title>
    <link rel="stylesheet" href="atelier.css" />
    <link rel="stylesheet" href="workspace.css">
    <link rel="stylesheet" href="character-gallery.css">
    <script defer src="workspace.js"></script>
    <script defer src="motion.js"></script>
    <script defer src="character-slices.js"></script>
    <script defer src="actor.js"></script>
    <script defer src="surveyor-art.js"></script>
    <script defer src="family-art.js"></script>
    <script defer src="vehicle-slices.js"></script>
    <script defer src="world-objects.js"></script>
    <script defer src="activity-props.js"></script>
    <script defer src="studio-props.js"></script>
    <script defer src="studio-rig.js"></script>
    <script defer src="studio-actions.js"></script>
    <script defer src="duet-clips.js"></script>
    <script defer src="motion-gestures.js"></script>
    <script defer src="movement-clips.js"></script>
    <script defer src="daily-clips.js"></script>
    <script defer src="social-clips.js"></script>
    <script defer src="work-clips.js"></script>
  <script defer src="studio-library.js"></script>
    <script defer src="pixel-headwear.js"></script>
    <script defer src="pixel-portrait.js"></script>
    <script defer src="portrait-styles.js"></script>
    <script defer src="seasonal-wardrobe.js"></script>
    <script defer src="wardrobe-patterns.js"></script>
    <script defer src="hair-styles.js"></script>
    <script defer src="infant-hair.js"></script>
    <script defer src="head-sections.js"></script>
    <script defer src="skull-core.js"></script>
    <script defer src="head-shape.js"></script>
    <script defer src="game-face.js"></script>
    <script defer src="short-hair.js"></script>
    <script defer src="collection-wardrobe.js"></script>
    <script defer src="everyday-styles.js"></script>
    <script defer src="workshop-wear.js"></script>
    <script defer src="world-wardrobe.js"></script>
    <script defer src="character-almanac.js"></script>
    <script defer src="character-titles.js"></script>
    <script defer src="character-collection.js"></script>
    <script defer src="figure-paint.js"></script>
    <script defer src="anatomy-core.js"></script>
    <script defer src="designer-body.js"></script>
    <script defer src="appearance.js"></script>
    <script defer src="figure-models.js"></script>
    <script defer src="appearance-store.js"></script>
    <script defer src="studio-stage.js"></script>
    <script defer src="atelier-preview.js"></script>
    <script defer src="character-gallery.js"></script>
    <script defer src="atelier.js"></script>
  </head>
  <body data-workspace="atelier">
    <header data-app-nav="atelier"></header>
    <main class="workspace-main">
      <header class="page-heading">
        <div class="page-name">
          <h1>人物创作室</h1>
          <span id="save-state" role="status">新形象</span>
        </div>
        <div class="page-actions">
          <div class="history-tools" role="group" aria-label="编辑历史">
            <button id="edit-undo" type="button" disabled title="撤销上一步">撤销</button>
            <button id="edit-redo" type="button" disabled title="重做上一步">重做</button>
          </div>
          <details class="workspace-files">
            <summary>文件</summary>
            <div>
              <button id="load" type="button">导入人物 JSON</button>
              <button id="export-look" type="button">导出人物 JSON</button>
              <button id="fork-look" type="button">另存为新形象</button>
            </div>
          </details>
          <button id="save-look" class="work-button" type="button">保存形象</button>
          <a id="studio-link" class="work-primary" href="studio.html?board=character">用此人物编排动作 <span aria-hidden="true">→</span></a>
        </div>
      </header>
      <p id="feedback" class="workspace-notice" role="status" aria-live="polite"></p>
      <input id="look-file" type="file" accept=".json,application/json" hidden>
      <div class="workbench workspace-desk" data-desk>
        <section class="preview-panel desk-preview" id="person-preview" data-label="预览" aria-label="人物试衣镜">
          <div class="stage-head">
            <div class="stage-name">
              <h2 id="mirror-name">溪谷学童</h2>
              <span id="stage-size" title="自然站姿身高，不计发型和帽饰"></span>
            </div>
            <div class="switch" aria-label="取景">
              <button data-view="body" aria-pressed="true">全身</button
              ><button data-view="face" aria-pressed="false">脸部</button>
            </div>
          </div>
          <div class="stage">
            <canvas
              id="mirror"
              data-framing="body"
              width="700"
              height="360"
              tabindex="0"
              aria-label="可拖动环视的像素人物。方向键旋转，空格播放"
            ></canvas>
            <span id="angle-tag" class="angle-tag">正面偏侧 · 24°</span>
            <label id="face-quality"><input type="checkbox" id="fine-face" checked /> 精细人物</label>
          </div>
          <div class="transport">
            <label for="action">试演动作<select id="action"></select></label
            ><button id="play-look" aria-pressed="false">播放</button>
            <label class="orbit" for="bearing"
              >环视<input id="bearing" type="range" min="0" max="360" value="24"
            /></label>
          </div>
          <p id="action-partner" hidden></p>
          <div class="compare">
            <label for="compare">对照人物</label
            ><select id="compare"></select
            >
          </div>
        </section>
        <div class="tool-side"><div class="tool-tabs" role="tablist" aria-label="编辑工具"></div>
        <section class="inspector tool-pane" id="person-edit" data-tool data-label="编辑形象" aria-label="形象编辑">
          <div class="inspector-head">
            <h2>人物设定</h2>
          </div>
          <label class="name-field"
            >角色名<input id="look-name" maxlength="48" required autocomplete="off"
          /></label>
          <details class="identity-settings"><summary>身份资料</summary><div class="identity-fields"><label>时代<select id="look-era"><option value="">未指定</option></select></label><label>职业或身份<input id="look-role" maxlength="48" list="role-options" autocomplete="off" placeholder="自定义身份"></label><datalist id="role-options"></datalist>
            <label>职业领域<select id="look-field"><option value="">未指定</option></select></label>
            <label>人物系列<select id="look-series"><option value="">未指定</option></select></label>
            <fieldset id="look-settings"><legend>活动场景</legend></fieldset></div></details>
          <div class="base-row">
            <span id="profile-label">默认体型</span>
            <div class="switch" role="group" aria-labelledby="profile-label">
              <button type="button" data-body-profile="female" aria-label="成年女性体型" aria-pressed="false">
                女
              </button>
              <button type="button" data-body-profile="male" aria-label="成年男性体型" aria-pressed="false">
                男
              </button>
              <button type="button" data-body-profile="child" aria-label="儿童中性体型" aria-pressed="true">
                儿童
              </button>
              <button type="button" data-body-profile="toddler" aria-pressed="false">幼儿</button>
              <button type="button" data-body-profile="baby" aria-pressed="false">婴儿</button>
            </div>
            <small id="legacy-body" hidden>原版成人体型</small>
          </div>
          <div class="category-buttons random-actions">
            <label class="portrait-style">画风
              <select id="portrait-style"><option value="animation">立体动画</option><option value="game">游戏立绘</option><option value="manga">漫画</option><option value="natural">自然</option></select>
            </label>
            <button type="button" id="random-character">随机人物</button><button type="button" id="undo-random" hidden>撤销随机</button>
          </div>
          <div class="figure-trial"><button type="button" id="try-ink" aria-pressed="false">试用像素立绘五官</button><button type="button" id="try-figure">试用动画美术脸型</button><a id="anatomy-link" href="anatomy-study.html">查看人体结构</a><a id="figure-link" href="figure-study.html">对照当前人物</a></div>
          <details class="random-settings">
            <summary>随机设置</summary>
            <label class="random-style">变化幅度
              <select id="random-style"><option value="natural">自然协调</option><option value="expressive">特征鲜明</option></select>
            </label>
            <fieldset>
              <legend>生成整个人物时保留</legend>
              <label><input type="checkbox" data-random-lock="body">体型与人体部件</label>
              <label><input type="checkbox" data-random-lock="skin">肤色</label>
              <label><input type="checkbox" data-random-lock="hair">发型与发色</label>
              <label><input type="checkbox" data-random-lock="wear">穿搭与配饰</label>
            </fieldset>
          </details>
          <template id="anatomy-fields">
            <fieldset class="preset-group">
              <legend>人体部件</legend>
              <div class="wardrobe-grid"></div>
            </fieldset>
          </template>
          <div class="tabs" role="tablist" aria-label="编辑类别">
            <button
              id="tab-shape"
              role="tab"
              aria-controls="editor-fields"
              aria-selected="true"
              data-tab="shape"
            >
              体型
            </button>
            <button
              id="tab-face"
              role="tab"
              aria-controls="editor-fields"
              aria-selected="false"
              data-tab="face"
            >
              五官
            </button>
            <button
              id="tab-hair"
              role="tab"
              aria-controls="editor-fields"
              aria-selected="false"
              data-tab="hair"
            >
              发型
            </button>
            <button
              id="tab-wear"
              role="tab"
              aria-controls="editor-fields"
              aria-selected="false"
              data-tab="wear"
            >
              穿搭
            </button>
            <button
              id="tab-colors"
              role="tab"
              aria-controls="editor-fields"
              aria-selected="false"
              data-tab="colors"
            >
              配色
            </button>
          </div>
          <div class="style-search" role="search" aria-label="查找形象款式">
            <label for="style-query">查找款式</label>
            <input
              id="style-query"
              type="search"
              placeholder="搜眼型、发型、衣服或配饰"
              autocomplete="off"
              aria-controls="style-results"
            />
            <section id="style-results" aria-label="匹配的款式" hidden>
              <p id="style-count" role="status"></p>
              <div id="style-matches"></div>
            </section>
          </div>
          <div id="editor-fields" class="fields" role="tabpanel" aria-labelledby="tab-shape"></div>
        </section>
        <section class="collection tool-pane" id="person-library" data-tool data-label="形象库" aria-label="人物形象库" hidden>
          <div class="gallery-heading">
            <h1>人物形象库</h1>
            <div class="gallery-find">
              <select id="shelf-source" aria-label="形象来源"><option value="">所有形象</option></select>
              <label class="gallery-search"><span aria-hidden="true"></span><input type="search" id="look-query" aria-label="搜索人物" placeholder="搜外观、衣物、配饰或原职业"></label>
            </div>
          </div>
          <div id="shelf-borrow" class="gallery-borrow" hidden><strong id="shelf-borrow-name"></strong><button id="shelf-borrow-back" type="button">返回编辑</button></div>
          <div class="gallery-realms" id="shelf-realms" role="group" aria-label="按时代筛选"></div>
          <div class="gallery-layout">
            <details class="gallery-filters" id="shelf-filter-panel" open>
              <summary>筛选条件<span id="shelf-filter-count"></span></summary>
              <div class="gallery-filter-fields">
                <label>职业领域<select id="shelf-field"><option value="">全部领域</option></select></label>
                <label>人物系列<select id="shelf-series"><option value="">全部系列</option></select></label>
                <label>活动场景<select id="shelf-setting"><option value="">全部场景</option></select></label>
                <label>年龄<select id="shelf-age"><option value="">全部年龄</option></select></label>
                <label>体型<select id="shelf-profile"><option value="">全部体型</option></select></label>
                <label>发型类别<select id="shelf-hair"><option value="">全部发型</option></select></label>
                <label>穿搭季节<select id="shelf-season"><option value="">全部季节</option></select></label>
                <label>衣装风格<select id="shelf-region"><option value="">全部风格</option></select></label>
                <label>服装款式<select id="shelf-garment"><option value="">全部服装</option></select></label>
                <label>随身配件<select id="shelf-gear"><option value="">全部配件</option></select></label>
              </div>
            </details>
            <div class="gallery-results" id="shelf-results" tabindex="-1">
              <div class="gallery-toolbar">
                <div class="gallery-browse">
                  <div class="gallery-total" role="status"><strong id="shelf-count"></strong><span id="shelf-range"></span></div>
                  <button type="button" id="shelf-draw" title="从全部筛选结果中抽一位，打开后可以继续编辑">随机选一位</button>
                  <nav class="gallery-quick-pages" id="shelf-quick" aria-label="快速翻页">
                    <button type="button" id="shelf-prev" aria-label="上一页">‹</button><span id="shelf-position"></span><button type="button" id="shelf-next" aria-label="下一页">›</button>
                  </nav>
                </div>
                <div class="gallery-display">
                  <select id="shelf-order" aria-label="排列顺序"><option value="featured">造型混排</option><option value="name">按名称排序</option></select>
                  <div class="gallery-framing" role="group" aria-label="形象卡视图"><button type="button" data-shelf-view="body" aria-pressed="true">全身</button><button type="button" data-shelf-view="face" aria-pressed="false">头像</button></div>
                </div>
              </div>
              <div class="gallery-chips"><button id="shelf-family-back" type="button" hidden>‹ 返回刚才的结果</button><span id="shelf-applied"></span><button type="button" class="clear-filter" id="clear-looks" hidden>清除筛选</button></div>
              <div id="look-shelf" class="shelf" data-framing="body"></div>
              <div id="shelf-empty" class="gallery-empty" hidden><strong>没有找到匹配的人物</strong><button type="button" id="empty-clear">查看全部人物</button></div>
              <footer class="gallery-footer"><label>每页 <select id="shelf-size"><option value="12">12 位</option><option value="24">24 位</option><option value="48">48 位</option></select></label><nav id="shelf-pages" aria-label="人物分页"></nav></footer>
            </div>
          </div>
        </section>
        </div>
      </div>
      <input id="pack-file" type="file" accept=".json,application/json" hidden />
      <template id="turnaround-guide">
        <details class="field-fold turnaround-guide">
          <summary>动画美术参考</summary>
          <div class="turnaround-content">
            <div class="turnaround-angles" role="group" aria-label="按参考图转动当前人物">
              <button type="button" data-art-angle="0"><span></span>正面</button>
              <button type="button" data-art-angle="315"><span></span>斜侧 45°</button>
              <button type="button" data-art-angle="270"><span></span>正侧 90°</button>
            </div>
            <a class="guide-comparison" href="animation-face-comparison.webp" target="_blank" rel="noopener">查看参考图与实时像素对照</a>
            <a href="appearance-standard.html#figure-art" target="_blank" rel="noopener">全身造型与配色样张</a>
          </div>
        </details>
      </template>
      <dialog id="switch-dialog" aria-labelledby="switch-title">
        <form method="dialog">
          <h2 id="switch-title">当前形象有未保存的修改</h2>
          <p>可以先保存当前形象，再打开选中的人物。</p>
          <div class="file-tools">
            <button value="cancel" autofocus>继续编辑</button><button value="save">保存并切换</button><button value="discard">放弃修改并切换</button>
          </div>
        </form>
      </dialog>
      <noscript>启用 JavaScript 后即可编辑人物和试看动作。</noscript>
    </main>
  </body>
</html>
